name: Deploy Flutter Web

# Membangun aplikasi pengunjung (Flutter web) lalu menerbitkannya ke GitHub Pages
# setiap push ke main. Aktifkan lebih dulu: Settings > Pages > Build and deployment > GitHub Actions,
# lalu isi repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
# dengan alamat backend publik, mis. https://sumbersira-api.onrender.com
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Versi dikunci sama dengan yang dipakai di laptop pengembang, supaya hasil CI tidak berubah saat Flutter stable naik versi.
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_URL=${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
