name: sumber_sira
description: "Aplikasi pengunjung wisata mata air Sumber Sira (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_fonts: ^6.2.1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
